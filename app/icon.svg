<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    :root {
      --bg-color: #1E1B18;
      --fg-color: #FAF8F5;
      --accent-color: #8C827A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #FAF8F5;
        --fg-color: #1E1B18;
        --accent-color: #A69E95;
      }
    }
  </style>
  
  <!-- Architectural Plinth Background -->
  <rect width="32" height="32" rx="6" fill="var(--bg-color)" />
  
  <!-- Subtle Framing Edge -->
  <rect x="2" y="2" width="28" height="28" rx="4" fill="none" stroke="var(--accent-color)" stroke-width="0.75" opacity="0.3" />
  
  <!-- Serif Monogram 'V' -->
  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    fill="var(--fg-color)" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="19" 
    font-weight="400"
    letter-spacing="0.5"
  >
    V
  </text>
  
  <!-- Minimalist Atelier Stone Dot -->
  <circle cx="21" cy="9.5" r="1.2" fill="var(--accent-color)" />
</svg>